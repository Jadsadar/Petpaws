# Deploy จริงขึ้น VPS — รันหลัง provision.yml (ลง Docker เสร็จแล้ว) เท่านั้น
#
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
#     --private-key ~/Downloads/petpaws-key.pem \
#     --extra-vars "env_file_src=/path/to/.env"
#
# env_file_src คือไฟล์ .env จริงของ production (ค่าจริงตาม .env.production.example
# ที่ root) — ห้าม commit ไฟล์นั้นเข้า git เด็ดขาด ตอนต่อเข้า GitHub Actions ค่อย
# เปลี่ยนมาถอดรหัสจาก SOPS แทนการส่ง path ตรงๆ แบบนี้
---
- name: Deploy Petpaws backend ขึ้น VPS
  hosts: petpaws_prod
  become: true

  vars:
    deploy_dir: /opt/petpaws
    # ข้อมูลที่ส่งให้ scripts/notify_discord.py (ค่า deploy_* มาจาก cd.yml ผ่าน --extra-vars ถ้ารันมือจะเป็น "-")
    notify_env:
      DEPLOY_DIR: "{{ deploy_dir }}"
      NOTIFY_COMMIT: "{{ deploy_commit | default('-') }}"
      NOTIFY_MESSAGE: "{{ deploy_message | default('-') }}"
      NOTIFY_ACTOR: "{{ deploy_actor | default('-') }}"
      NOTIFY_URL: "{{ deploy_run_url | default('') }}"
      NOTIFY_START: "{{ ansible_facts['date_time']['epoch'] }}"

  tasks:
    - name: เช็คว่าใส่ env_file_src มาหรือยัง
      ansible.builtin.fail:
        msg: "ต้องส่ง --extra-vars \"env_file_src=/path/to/.env\" มาด้วย"
      when: env_file_src is not defined

    # t3.micro มี RAM แค่ 1GB — docker build ของ Nest ร่วมกับ postgres/redis/api/worker/caddy
    # ทำให้เครื่องค้างจน SSH ไม่ตอบ (CD ล้มด้วย "timed out during banner exchange")
    # swap 2GB กันเครื่องค้าง ไม่เร็วเท่า RAM จริง แต่ดีกว่าโดน OOM / ค้างทั้งเครื่อง
    - name: สร้างไฟล์ swap ขนาด 2GB (ข้ามถ้ามีอยู่แล้ว)
      ansible.builtin.command:
        cmd: fallocate -l 2G /swapfile
        creates: /swapfile

    - name: ตั้งสิทธิ์ไฟล์ swap ให้ root อ่านได้คนเดียว
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"

    - name: เปิดใช้งาน swap (ข้ามถ้าเปิดอยู่แล้ว)
      ansible.builtin.shell: |
        set -o pipefail
        if swapon --show=NAME --noheadings | grep -qx /swapfile; then
          echo "already-active"
        else
          mkswap /swapfile && swapon /swapfile && echo "activated"
        fi
      args:
        executable: /bin/bash
      register: swap_result
      changed_when: "'activated' in swap_result.stdout"

    - name: ให้ swap เปิดอัตโนมัติหลังรีบูต
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        state: present

    - name: สร้างโฟลเดอร์ deploy
      ansible.builtin.file:
        path: "{{ deploy_dir }}/backend/api"
        state: directory
        mode: "0755"

    - name: Copy docker-compose.prod.yml และ Caddyfile
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ deploy_dir }}/{{ item }}"
        mode: "0644"
      loop:
        - docker-compose.prod.yml
        - Caddyfile

    - name: Copy ไฟล์ config ของ backend/api ที่ build image ต้องใช้
      ansible.builtin.copy:
        src: "../backend/api/{{ item }}"
        dest: "{{ deploy_dir }}/backend/api/{{ item }}"
        mode: "0644"
      loop:
        - Dockerfile
        - package.json
        - package-lock.json
        - tsconfig.json
        - tsconfig.build.json
        - nest-cli.json

    - name: Copy source code (src/)
      ansible.builtin.copy:
        src: ../backend/api/src/
        dest: "{{ deploy_dir }}/backend/api/src/"
        mode: preserve

    - name: Copy migration SQL (db/migrations/)
      ansible.builtin.copy:
        src: ../backend/db/migrations/
        dest: "{{ deploy_dir }}/backend/db/migrations/"
        mode: preserve

    - name: Copy สคริปต์รัน migration (migrate.sh)
      ansible.builtin.copy:
        src: ../backend/db/migrate.sh
        dest: "{{ deploy_dir }}/backend/db/migrate.sh"
        mode: "0755"

    - name: Copy สคริปต์สำรองฐานข้อมูล (backup.sh)
      ansible.builtin.copy:
        src: ../backend/db/backup.sh
        dest: "{{ deploy_dir }}/backend/db/backup.sh"
        mode: "0755"

    - name: สร้างโฟลเดอร์เก็บไฟล์สำรอง (เฉพาะ root อ่านได้)
      ansible.builtin.file:
        path: "{{ deploy_dir }}/backups"
        state: directory
        owner: root
        mode: "0700"

    - name: สร้างโฟลเดอร์สคริปต์ดูแลระบบ
      ansible.builtin.file:
        path: "{{ deploy_dir }}/scripts"
        state: directory
        mode: "0755"

    - name: Copy สคริปต์แจ้ง Discord (รายงานประจำวัน + สถานะ deploy)
      ansible.builtin.copy:
        src: "../scripts/{{ item }}"
        dest: "{{ deploy_dir }}/scripts/{{ item }}"
        mode: "0755"
      loop:
        - daily_report.py
        - notify_discord.py

    - name: Copy .env production (ค่าจริง ไม่ใช่ example)
      ansible.builtin.copy:
        src: "{{ env_file_src }}"
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"

    # แยก pull / build / up เป็นขั้นๆ แทนคำสั่งเดียว เพราะ CD #3 และ #6 ค้างจน job หมดเวลา
    # 15 นาทีโดยไม่รู้ว่าค้างตรงไหน (Ansible เก็บ output ไว้จนคำสั่งจบ) ตอนนี้ทุกขั้น
    # (1) มี timeout ของตัวเอง (2) ใช้ async/poll กัน SSH ค้างเงียบ (3) เขียน log ไว้ที่
    # {{ deploy_dir }}/deploy.log และถ้าล้มเหลว rescue จะดึง log + สถานะเครื่องมาแสดงให้ดูใน CI
    # แจ้ง Discord ว่าเริ่ม/สำเร็จ/ล้มเหลว — ล้มเหลวในการแจ้ง (ไม่มี Webhook ฯลฯ) ต้องไม่ทำให้ deploy ล้ม
    - name: แจ้ง Discord ว่าเริ่ม deploy
      ansible.builtin.command:
        cmd: /usr/bin/python3 {{ deploy_dir }}/scripts/notify_discord.py
      environment: "{{ notify_env | combine({'NOTIFY_STATUS': 'start'}) }}"
      changed_when: false
      failed_when: false

    - name: Deploy containers (pull → build → up → รอ healthy)
      block:
        - name: Docker compose pull (image สำเร็จรูป เช่น postgres, redis, caddy)
          ansible.builtin.shell: |
            set -o pipefail
            timeout 600 docker compose -f docker-compose.prod.yml --env-file .env pull --ignore-buildable 2>&1 | tee -a deploy.log
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          async: 700
          poll: 10
          changed_when: true

        - name: Docker compose build (image ของเราเอง คือ api และ worker)
          ansible.builtin.shell: |
            set -o pipefail
            timeout 900 docker compose -f docker-compose.prod.yml --env-file .env build 2>&1 | tee -a deploy.log
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          async: 1000
          poll: 10
          changed_when: true

        # initdb รันไฟล์ migration ครั้งเดียวตอน volume ว่างเท่านั้น — migration ใหม่ต้องรันเองก่อน
        # api ตัวใหม่ขึ้น ไม่งั้นโค้ดใหม่เจอ schema เก่า (migrate.sh จำไฟล์ที่รันแล้ว รันซ้ำได้ปลอดภัย)
        - name: เริ่ม postgres และรอ healthy ก่อนรัน migration
          ansible.builtin.shell: |
            set -o pipefail
            timeout 120 docker compose -f docker-compose.prod.yml --env-file .env up -d postgres 2>&1 | tee -a deploy.log
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          changed_when: false

        - name: รอ postgres healthy
          ansible.builtin.command:
            cmd: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' petpaws-postgres
          register: pg_health
          until: pg_health.stdout == 'healthy'
          retries: 24
          delay: 5
          changed_when: false

        # สำรองก่อนแตะ schema ทุกครั้ง — ถ้า migration ใหม่ทำข้อมูลเสีย จะมีจุดย้อนกลับ
        # (ล้มแล้วหยุด deploy ทันที ดีกว่า migrate โดยไม่มีสำรอง)
        - name: สำรองฐานข้อมูลก่อนรัน migration
          ansible.builtin.command:
            cmd: /bin/bash backend/db/backup.sh
            chdir: "{{ deploy_dir }}"
          environment:
            ENV_FILE: "{{ deploy_dir }}/.env"
            BACKUP_DIR: "{{ deploy_dir }}/backups"
          register: backup_out
          changed_when: "'สำรองฐานข้อมูล:' in backup_out.stdout"

        - name: รัน migration ที่ยังไม่เคยรัน
          ansible.builtin.shell: |
            set -o pipefail
            export POSTGRES_USER="$(grep '^POSTGRES_USER=' .env | cut -d= -f2-)"
            export POSTGRES_DB="$(grep '^POSTGRES_DB=' .env | cut -d= -f2-)"
            sh backend/db/migrate.sh 2>&1 | tee -a deploy.log
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          register: migrate_out
          changed_when: "'รัน migration:' in migrate_out.stdout"

        - name: Docker compose up
          ansible.builtin.shell: |
            set -o pipefail
            timeout 300 docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans 2>&1 | tee -a deploy.log
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          async: 400
          poll: 10
          changed_when: true

        - name: รอให้ API healthy (สูงสุด ~2.5 นาที)
          ansible.builtin.command:
            cmd: docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' petpaws-api
          register: api_health
          until: api_health.stdout == 'healthy'
          retries: 30
          delay: 5
          changed_when: false

      rescue:
        - name: ดึง log และสถานะเครื่องมาแสดง (เพื่อรู้ว่าล้มตรงไหน)
          ansible.builtin.shell: |
            set -o pipefail
            echo "== deploy.log (60 บรรทัดสุดท้าย) =="; tail -n 60 deploy.log 2>&1
            echo "== docker compose ps =="; docker compose -f docker-compose.prod.yml --env-file .env ps 2>&1
            echo "== แรม / ดิสก์ =="; free -m; df -h / | tail -1
            echo "== log ของ api =="; docker logs --tail 30 petpaws-api 2>&1 || true
          args:
            chdir: "{{ deploy_dir }}"
            executable: /bin/bash
          register: deploy_diag
          changed_when: false
          failed_when: false

        - name: แสดงผลวินิจฉัย
          ansible.builtin.debug:
            msg: "{{ deploy_diag.stdout_lines }}"

        - name: แจ้ง Discord ว่า deploy ล้มเหลว
          ansible.builtin.command:
            cmd: /usr/bin/python3 {{ deploy_dir }}/scripts/notify_discord.py
          environment: "{{ notify_env | combine({'NOTIFY_STATUS': 'fail', 'NOTIFY_FAILED_TASK': ansible_failed_task.name | default('-')}) }}"
          changed_when: false
          failed_when: false

        - name: ทำให้ playbook ล้มเหลวอย่างชัดเจน
          ansible.builtin.fail:
            msg: "Deploy ล้มเหลว — ดู log วินิจฉัยด้านบน"

    # สำรองอัตโนมัติทุกวัน 03:00 UTC (10:00 น. เวลาไทย) เก็บ 14 วัน — ดู backend/db/backup.sh
    # ไฟล์อยู่ดิสก์เดียวกับระบบ กันได้เฉพาะข้อมูลถูกลบ/แก้พลาด ดิสก์พังต้องใช้ EBS snapshot ควบคู่
    - name: ตั้ง cron สำรองฐานข้อมูลรายวัน
      ansible.builtin.cron:
        name: petpaws daily backup
        user: root
        minute: "0"
        hour: "3"
        job: >-
          ENV_FILE={{ deploy_dir }}/.env BACKUP_DIR={{ deploy_dir }}/backups
          /bin/bash {{ deploy_dir }}/backend/db/backup.sh
          >> {{ deploy_dir }}/backups/backup.log 2>&1

    # รายงานเช้าเข้า Discord ทุกวัน 08:00 เวลาไทย (= 01:00 UTC เพราะ cron ของเครื่องใช้ UTC)
    # ต้องมีไฟล์ {{ deploy_dir }}/.discord-webhook (Webhook URL เป็นความลับ สร้างมือครั้งเดียว ไม่เก็บใน git)
    # ไม่มีไฟล์ = สคริปต์แค่เขียนเตือนใน log แล้วจบ ไม่กระทบระบบ
    - name: ตั้ง cron รายงานเช้าเข้า Discord
      ansible.builtin.cron:
        name: petpaws daily discord report
        user: root
        minute: "0"
        hour: "1"
        job: >-
          DEPLOY_DIR={{ deploy_dir }}
          /usr/bin/python3 {{ deploy_dir }}/scripts/daily_report.py
          >> {{ deploy_dir }}/backups/daily-report.log 2>&1

    - name: แจ้ง Discord ว่า deploy สำเร็จ
      ansible.builtin.command:
        cmd: /usr/bin/python3 {{ deploy_dir }}/scripts/notify_discord.py
      environment: "{{ notify_env | combine({'NOTIFY_STATUS': 'ok'}) }}"
      changed_when: false
      failed_when: false
