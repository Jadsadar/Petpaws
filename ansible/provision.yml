# รันครั้งแรกตอนตั้งเครื่อง VPS ใหม่ (ลง Docker) — รันซ้ำได้ปลอดภัย (idempotent)
# ansible-playbook -i ansible/inventory.ini ansible/provision.yml --private-key ~/Downloads/petpaws-key.pem
---
- name: Provision Docker บน VPS
  hosts: petpaws_prod
  become: true

  tasks:
    - name: อัปเดต apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: ลง package ที่ต้องใช้ก่อนเพิ่ม repo ของ Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: สร้างโฟลเดอร์เก็บ apt keyring
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: ดาวน์โหลด + แปลง GPG key ของ Docker (ข้ามถ้ามีอยู่แล้ว)
      ansible.builtin.shell: |
        set -euo pipefail
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
        executable: /bin/bash

    - name: เพิ่ม apt repository ของ Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present
        update_cache: true

    - name: ลง Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: เพิ่ม ubuntu เข้ากลุ่ม docker (ไม่ต้อง sudo ทุกครั้ง)
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: เปิด docker service ให้ auto-start
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: เช็คเวอร์ชัน Docker ที่ลงเสร็จ
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: แสดงผลเวอร์ชัน
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"
