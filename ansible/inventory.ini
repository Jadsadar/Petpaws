# คัดลอกไฟล์นี้เป็น inventory.ini แล้วแก้ ansible_host ให้ตรงกับ Elastic IP จริง
# ห้าม commit ค่า IP/โดเมนจริงถ้าไม่อยากเปิดเผยต่อสาธารณะ (repo นี้เป็น private อยู่แล้วก็ไม่บังคับ)
[petpaws_prod]
petpaws-vps ansible_host=3.24.61.96 ansible_user=ubuntu

[petpaws_prod:vars]
# ชี้ไปไฟล์ .pem จริงในเครื่องคุณ หรือจะ override ตอนรันด้วย --private-key ก็ได้
# เช่น: ansible-playbook -i ansible/inventory.ini ansible/provision.yml --private-key ~/Downloads/petpaws-key.pem
ansible_ssh_private_key_file=~/.ssh/petpaws-key.pem
ansible_python_interpreter=/usr/bin/python3
