# คัดลอกไฟล์นี้เป็น inventory.ini แล้วแก้ ansible_host ให้ตรงกับ Elastic IP จริง
# ห้าม commit ค่า IP/โดเมนจริงถ้าไม่อยากเปิดเผยต่อสาธารณะ (repo นี้เป็น private อยู่แล้วก็ไม่บังคับ)
[petpaws_prod]
petpaws-vps ansible_host=3.24.61.96 ansible_user=ubuntu

[petpaws_prod:vars]
# ห้ามกำหนด ansible_ssh_private_key_file ในไฟล์นี้ — ค่าใน inventory ชนะ --private-key
# จาก command line ทำให้ CI หากุญแจไม่เจอ (เคยพังจริงใน CD #3) ให้ส่งกุญแจตอนรันเสมอ:
#   ansible-playbook -i ansible/inventory.ini ansible/provision.yml --private-key <path ของ .pem>
ansible_python_interpreter=/usr/bin/python3
# ไม่ถาม host key (รันใน CI ไม่มีคนตอบ) และส่ง keepalive กัน SSH ค้างเงียบๆ ถ้าเครือข่ายหลุด
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=4'
