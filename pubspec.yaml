name: petpaws
description: PetPaws - แอปหาบ้านให้สัตว์เลี้ยง
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  intl: ^0.20.3
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_secure_storage: ^9.2.2
  socket_io_client: ^3.1.6
  image: ^4.10.1
  video_player: ^2.14.0
  video_compress: ^3.1.4
  cached_network_image: ^3.4.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true

  # ภาพพื้นหลังลายอุ้งเท้า: bg_web แนวนอน, bg_mobile แนวตั้ง (แอปเลือกตามสัดส่วนจอ)
  assets:
    - assets/images/

  # ฟอนต์ฝังในแอป ไม่ต้องโหลดจากเน็ต (ใบอนุญาต OFL ดู assets/fonts/OFL-*.txt)
  # TitanOne = ตัวอักษรอังกฤษ/ตัวเลข, Sarabun = ภาษาไทย (fallback)
  fonts:
    - family: TitanOne
      fonts:
        - asset: assets/fonts/TitanOne-Regular.ttf
    - family: Sarabun
      fonts:
        - asset: assets/fonts/Sarabun-Regular.ttf
        - asset: assets/fonts/Sarabun-Medium.ttf
          weight: 500
        - asset: assets/fonts/Sarabun-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Sarabun-Bold.ttf
          weight: 700
        - asset: assets/fonts/Sarabun-ExtraBold.ttf
          weight: 800
