# CD: รันหลัง merge เข้า main (หรือกดรันมือผ่าน workflow_dispatch ตอนทดสอบ)
# ต้องตั้ง GitHub Secrets ก่อนใช้งานจริง (Settings > Secrets and variables > Actions):
#   PROD_SSH_KEY   = เนื้อหาไฟล์ .pem ทั้งไฟล์ (private key ของ VPS)
#   PROD_ENV_FILE  = เนื้อหาไฟล์ .env ของ production ทั้งไฟล์ (ดู .env.production.example)
#
# หมายเหตุ: ยังไม่ได้ต่อ SOPS จริง — ตอนนี้ .env เก็บเป็น GitHub Secret เข้ารหัสโดย
# GitHub เอง (ปลอดภัยพอสำหรับตอนนี้) ค่อยย้ายไป SOPS ทีหลังได้ถ้าต้องการ audit trail
# ในไฟล์ git แทน

name: CD

# รอให้ CI (ci.yml) รันจบและผ่านทุก job ก่อน (รวม Gitleaks, Semgrep, Trivy) ถ้า CI แดง
# หรือถูกยกเลิก ขั้นนี้จะไม่ทำงานเลย เดิมใช้ push: เฉย ๆ ทำให้รันพร้อม CI และไม่รอผล
# หมายเหตุ: workflow_run อ่านไฟล์ workflow จาก branch หลักเท่านั้น จะมีผลหลัง merge เข้า main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# ตั้งสิทธิ์ token ให้น้อยที่สุด ขั้น deploy แค่อ่านโค้ด ไม่ต้องเขียนอะไรกลับเข้า repo
permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch = คนกดรันเองโดยตั้งใจ, workflow_run = CI ของ push เข้า main ผ่านแล้วเท่านั้น
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')

    steps:
      # build จาก commit ที่ CI ตรวจผ่านแล้วตรง ๆ (ไม่ใช่ปลาย main ณ ตอนนี้ ซึ่งอาจมี commit ใหม่เข้ามาแล้ว)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ลง Ansible
        run: pip install --disable-pip-version-check ansible

      - name: เตรียม SSH private key
        run: |
          install -m 600 -D /dev/null ~/.ssh/petpaws-deploy.pem
          cat <<'EOF' > ~/.ssh/petpaws-deploy.pem
          ${{ secrets.PROD_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/petpaws-deploy.pem

      - name: เตรียมไฟล์ .env production
        run: |
          cat <<'EOF' > /tmp/prod.env
          ${{ secrets.PROD_ENV_FILE }}
          EOF

      - name: ลง Docker บน VPS (idempotent — ข้ามถ้ามีอยู่แล้ว)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/provision.yml \
            --private-key ~/.ssh/petpaws-deploy.pem

      - name: Deploy ขึ้น VPS
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --private-key ~/.ssh/petpaws-deploy.pem \
            --extra-vars "env_file_src=/tmp/prod.env"
