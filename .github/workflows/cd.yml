# CD: รันหลัง merge เข้า main (หรือกดรันมือผ่าน workflow_dispatch ตอนทดสอบ)
# ต้องตั้ง GitHub Secrets ก่อนใช้งานจริง (Settings > Secrets and variables > Actions):
#   PROD_SSH_KEY  = เนื้อหาไฟล์ .pem ทั้งไฟล์ (private key ของ VPS)
#   PROD_AGE_KEY  = เนื้อหาไฟล์ private key ของ age ทั้งไฟล์ (~/.config/sops/age/keys.txt)
#                   ใช้ถอดรหัส secrets/production.env.enc ที่ commit ไว้ใน repo
#
# ค่าจริงของ production เข้ารหัสด้วย SOPS เก็บไว้ที่ secrets/production.env.enc
# (ดู .sops.yaml) แก้ค่าแล้ว re-encrypt ใหม่ด้วย: sops -e .env > secrets/production.env.enc
# ไม่ต้องไปแก้ GitHub Secret ทุกครั้งที่ .env เปลี่ยน — แก้แค่ไฟล์ที่ commit เข้า git

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ลง Ansible
        run: pip install --disable-pip-version-check ansible

      - name: เตรียม SSH private key
        run: |
          install -m 600 -D /dev/null ~/.ssh/petpaws-deploy.pem
          cat <<'EOF' > ~/.ssh/petpaws-deploy.pem
          ${{ secrets.PROD_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/petpaws-deploy.pem

      - name: ลง SOPS
        run: |
          curl -sL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 -o /usr/local/bin/sops
          sudo chmod +x /usr/local/bin/sops

      - name: ถอดรหัสไฟล์ .env production ด้วย SOPS
        run: |
          install -m 600 -D /dev/null /tmp/age-key.txt
          cat <<'EOF' > /tmp/age-key.txt
          ${{ secrets.PROD_AGE_KEY }}
          EOF
          SOPS_AGE_KEY_FILE=/tmp/age-key.txt sops --input-type dotenv --output-type dotenv \
            -d secrets/production.env.enc > /tmp/prod.env
          rm -f /tmp/age-key.txt

      - name: ลง Docker บน VPS (idempotent — ข้ามถ้ามีอยู่แล้ว)
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/provision.yml \
            --private-key ~/.ssh/petpaws-deploy.pem

      - name: Deploy ขึ้น VPS
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/deploy.yml \
            --private-key ~/.ssh/petpaws-deploy.pem \
            --extra-vars "env_file_src=/tmp/prod.env"
