name: Release

# ทำงานเฉพาะตอน merge เข้า main เท่านั้น (ขั้น Release ในวงรอบ DevOps ต้องมาหลัง
# ขั้น Build/Test ผ่านแล้วเสมอ)
# workflow_dispatch ไว้ให้กดรันเองได้ เผื่อต้องทดสอบหรือออก release ซ้ำโดยไม่ต้อง push ใหม่
#
# รอให้ CI (ci.yml) รันจบและผ่านทุก job ก่อน (รวม Gitleaks, Semgrep, Trivy) ถ้า CI แดง
# หรือถูกยกเลิก ขั้นนี้จะไม่ทำงานเลย เดิมใช้ push: เฉย ๆ ทำให้รันพร้อม CI และไม่รอผล
# หมายเหตุ: workflow_run อ่านไฟล์ workflow จาก branch หลักเท่านั้น จะมีผลหลัง merge เข้า main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # ต้องมีสิทธิ์เขียนเพื่อสร้าง GitHub Release และ tag

jobs:
  build-and-release:
    name: Build release APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_dispatch = คนกดรันเองโดยตั้งใจ, workflow_run = CI ของ push เข้า main ผ่านแล้วเท่านั้น
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      # build จาก commit ที่ CI ตรวจผ่านแล้วตรง ๆ (ไม่ใช่ปลาย main ณ ตอนนี้ ซึ่งอาจมี commit ใหม่เข้ามาแล้ว)
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.3
          cache: true

      - name: Install
        run: flutter pub get --enforce-lockfile

      # เซ็นด้วย keystore ตัวจริงตัวเดียวกันทุกเวอร์ชัน (เก็บเป็น GitHub Secrets)
      # จำเป็นต่อการอัพเดตในแอป: ถ้าลายเซ็นไม่เหมือนเวอร์ชันที่ผู้ใช้ติดตั้งอยู่ Android จะไม่ยอมติดตั้งทับ
      # ไม่มี secrets = หยุดทันที ไม่ปล่อย APK ที่เซ็นด้วย debug key ออกไปเป็น "เวอร์ชันล่าสุด"
      # (ผู้ใช้จะได้แจ้งอัพเดต แต่ติดตั้งไม่ได้) — วิธีตั้งค่าดู README หัวข้อ "แอป Android และการอัพเดต"
      - name: ตั้งค่าเซ็นชื่อแอป (keystore ตัวจริง)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::ยังไม่ได้ตั้ง GitHub Secrets สำหรับเซ็นแอป (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) — ดู README"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=1.0.${{ github.run_number }}

      # พิมพ์ลายนิ้วมือใบรับรองที่เซ็นแอป ไว้เทียบว่าทุกรอบเป็นคีย์เดียวกัน
      # (ต้องตรงกับ SHA256 ของ keystore ที่สร้างไว้ ถ้าเปลี่ยนไป ผู้ใช้เดิมจะอัพเดตไม่ได้)
      - name: ตรวจลายเซ็นของ APK
        run: keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PetPaws v1.0.${{ github.run_number }}
          # ระบุ commit ตรง ๆ กันไม่ให้ tag ไปผูกกับปลาย branch หลักของ repo แทน
          # (ถ้าไม่ใส่ ตอนรันจาก branch อื่นที่ไม่ใช่ main ผ่าน workflow_dispatch จะเจอ
          # ปัญหานี้ — พบตอนทดสอบจริงว่า tag ไปโผล่ที่ commit ของ main แทน commit ที่ build)
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
