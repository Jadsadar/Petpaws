# รันบน VPS จริงเท่านั้น (ไม่ใช่ตัวที่ใช้ dev ในเครื่อง — ดู backend/docker-compose.yml สำหรับ dev)
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# ต้องมีไฟล์ .env อยู่ข้างๆ ไฟล์นี้ก่อน (ดูตัวอย่างค่าที่ .env.production.example)
# ห้าม commit ไฟล์ .env จริงเข้า git เด็ดขาด
#
# ตั้ง project name แยกจาก backend/docker-compose.yml (dev) โดยเฉพาะ — เคยเจอบั๊กจริง
# ตอนทดสอบ: ถ้าใช้ชื่อ "petpaws" ซ้ำกันทั้งสองไฟล์ Docker จะ mount volume postgres_data
# ตัวเดียวกันกับฝั่ง dev ทำให้ Postgres ใช้รหัสผ่านเก่าจาก dev ค้างอยู่ ในขณะที่ .env
# ของ production ตั้งรหัสผ่านใหม่ ผลคือ API ต่อ DB ไม่ได้เพราะรหัสผ่านไม่ตรงกัน
name: petpaws-prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: petpaws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: petpaws-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis ตัวที่สองสำหรับ cache ของ API เท่านั้น — แยกจากตัวบนโดยตั้งใจ:
  # ตัวบน (คิว BullMQ) ต้อง noeviction + AOF เพราะ job ห้ามหาย ส่วน cache ต้องไล่ key เก่าทิ้งได้
  # ถ้าใช้ตัวเดียวกัน cache ที่โตจนเต็ม maxmemory จะทำให้ add job ไม่ได้ทั้งระบบ
  # - volatile-lru: ไล่เฉพาะ key ที่มี TTL (ข้อมูล cache ทุกตัวมี) ตัวนับ hit/miss ที่ไม่มี TTL จึงไม่โดนไล่
  # - ไม่เปิด AOF/RDB: cache หายตอน restart ได้ ไม่ต้องเปลือง disk/IO บน t3.micro
  # - maxmemory เล็กเพราะเครื่องมี RAM แค่ 1GB ดูค่า evicted_keys ที่หน้า "สถิติ cache" ถ้าขึ้นเรื่อย ๆ ค่อยขยาย
  redis-cache:
    image: redis:7-alpine
    container_name: petpaws-redis-cache
    restart: unless-stopped
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory ${REDIS_CACHE_MAXMEMORY:-64mb}
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # object storage แบบ dev-grade ไว้ก่อน — สลับเป็น S3/R2 จริงทีหลังได้แค่เปลี่ยน
  # S3_ENDPOINT/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY ใน .env แล้วลบ service นี้ทิ้ง
  #
  # ห้ามใช้ quay.io/minio/minio หรือ minio/minio — MinIO เลิกแจก image ทางการแล้ว pull ได้
  # 401 Unauthorized (CD บน GitHub ล้มด้วยเหตุนี้จริง และทดสอบแล้วว่า tag ที่ปักเวอร์ชันไว้
  # ก็ดึงไม่ได้ทั้ง quay.io และ Docker Hub) ใช้ bitnamilegacy/minio ซึ่งเป็น MinIO ตัวจริง
  # ที่ถูกแช่แข็งไว้ที่ 2025.7.23 แทน (ไม่มี security patch ใหม่ และ repo legacy อาจถูกลบ
  # ในอนาคต — ระยะยาวควรย้ายไป S3 จริงหรือ mirror image ไว้ใน GHCR ของเราเอง)
  # ทดสอบแล้วว่า API ใช้งานได้ครบ: CreateBucket, PutBucketPolicy, PutObject,
  # อ่านรูปแบบไม่ล็อกอิน, ListObjectsV2, DeleteObjects
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r3
    container_name: petpaws-minio
    restart: unless-stopped
    # image ของ Bitnami เปิด server เองที่ /bitnami/minio/data (ไม่ต้องใส่ command)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend/api
    container_name: petpaws-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # ที่อยู่ที่แอปเข้าถึงรูป/ไฟล์ได้จริง (ผ่าน Caddy path /petpaws-media/) — ไม่ใช่ความลับ จึงตั้งที่นี่
      # ไม่ใช่ใน secrets/production.env.enc ถ้ามีโดเมนแล้วตั้ง S3_PUBLIC_ENDPOINT ใน .env ทับได้
      # (S3_ENDPOINT=http://minio:9000 ยังเป็นที่อยู่ภายในที่ API ใช้เรียก MinIO เอง)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://43.211.6.248}
      # ที่อยู่ภายในเครือข่าย docker ไม่ใช่ความลับ — worker ไม่ใช้ cache จึงไม่ตั้งให้
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis-cache:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # ไม่รอ healthy — cache ล่ม API ยังทำงานต่อได้ (อ่าน DB ตรง) แค่ช้าลง
      redis-cache:
        condition: service_started
      minio:
        condition: service_healthy
    # ไม่ expose port ออก host ตรงๆ — เข้าถึงได้ผ่าน Caddy เท่านั้น

  # BullMQ worker (ส่ง push แชท + ลบไฟล์รูปค้างทุกคืน) — image เดียวกับ api แต่รัน
  # dist/worker แทน ไม่เปิด HTTP port ถ้าไม่มี service นี้ job จะค้างในคิวไม่มีใครทำ
  worker:
    build:
      context: ./backend/api
    container_name: petpaws-worker
    restart: unless-stopped
    command: ["node", "dist/worker"]
    env_file:
      - .env
    environment:
      # ที่อยู่ที่แอปเข้าถึงรูป/ไฟล์ได้จริง (ผ่าน Caddy path /petpaws-media/) — ไม่ใช่ความลับ จึงตั้งที่นี่
      # ไม่ใช่ใน secrets/production.env.enc ถ้ามีโดเมนแล้วตั้ง S3_PUBLIC_ENDPOINT ใน .env ทับได้
      # (S3_ENDPOINT=http://minio:9000 ยังเป็นที่อยู่ภายในที่ API ใช้เรียก MinIO เอง)
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://43.211.6.248}
    # HEALTHCHECK ใน Dockerfile ยิง :3000/health ของ api — worker ไม่มี HTTP จะขึ้น unhealthy ตลอด
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: petpaws-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ใช้ :- ไม่ใช่ - เฉยๆ เพราะ .env ตั้ง PETPAWS_DOMAIN= (ว่างแต่ "set" อยู่) ไม่ใช่ unset
      # Caddyfile เองมี {$PETPAWS_DOMAIN:default} แต่ Caddy ไม่ fallback ให้ถ้าตัวแปร
      # ถูก set เป็นค่าว่าง (ต่างจาก unset) ต้อง resolve fallback ที่ชั้น compose แทน
      # ไม่งั้น Caddy จะได้ site address เป็นค่าว่าง แล้ว parse Caddyfile พังทั้งไฟล์
      # fallback เป็น ":80" (รับทุก Host แบบ HTTP) ไม่ใช่ "http://<IP>" เพราะแบบหลังจะตอบ
      # 200 ว่างเปล่าให้ทุก request ที่ Host ไม่ตรง IP เป๊ะ (เช่น เรียกผ่าน localhost, ชื่อ DNS
      # ของ EC2, หรือ health checker) โดยไม่ส่งต่อถึง API เลย — เคยหลอกให้นึกว่าทดสอบผ่าน
      PETPAWS_DOMAIN: ${PETPAWS_DOMAIN:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: petpaws-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
