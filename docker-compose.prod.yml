# รันบน VPS จริงเท่านั้น (ไม่ใช่ตัวที่ใช้ dev ในเครื่อง — ดู backend/docker-compose.yml สำหรับ dev)
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# ต้องมีไฟล์ .env อยู่ข้างๆ ไฟล์นี้ก่อน (ดูตัวอย่างค่าที่ .env.production.example)
# ห้าม commit ไฟล์ .env จริงเข้า git เด็ดขาด

name: petpaws

services:
  postgres:
    image: postgres:16-alpine
    container_name: petpaws-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: petpaws-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory ${REDIS_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # object storage แบบ dev-grade ไว้ก่อน — สลับเป็น S3/R2 จริงทีหลังได้แค่เปลี่ยน
  # S3_ENDPOINT/S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY ใน .env แล้วลบ service นี้ทิ้ง
  minio:
    image: quay.io/minio/minio:latest
    container_name: petpaws-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ./backend/api
    container_name: petpaws-api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # ไม่ expose port ออก host ตรงๆ — เข้าถึงได้ผ่าน Caddy เท่านั้น

  caddy:
    image: caddy:2-alpine
    container_name: petpaws-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PETPAWS_DOMAIN: ${PETPAWS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: petpaws-uptime-kuma
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:
